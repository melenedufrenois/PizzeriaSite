
services:
  # ============================================
  # 🐘 PHP/Symfony Application
  # ============================================
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizzeria_php
    restart: unless-stopped
    # 🔒 Limite mémoire pour serveur 2Go
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - .:/var/www/html:cached
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: mysql://pizzeria_user:pizzeria_password@database:3306/pizzeria?serverVersion=8.0.32&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy
    networks:
      - pizzeria_network

  # ============================================
  # 🌐 Nginx Web Server
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: pizzeria_nginx
    restart: unless-stopped
    # 🔒 Limite mémoire pour serveur 2Go
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - pizzeria_network

  # ============================================
  # 🗄️ MySQL Database (Optimisé pour 2Go RAM)
  # ============================================
  database:
    image: mysql:8.0
    container_name: pizzeria_mysql
    restart: unless-stopped
    # 🔒 Limite mémoire pour serveur 2Go
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pizzeria
      MYSQL_USER: pizzeria_user
      MYSQL_PASSWORD: pizzeria_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
    # ⚡ Configuration MySQL optimisée pour faible RAM
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=50
      --key-buffer-size=16M
      --tmp-table-size=16M
      --max-heap-table-size=16M
      --performance-schema=OFF
      --table-open-cache=200
      --thread-cache-size=4
    networks:
      - pizzeria_network

  # ============================================
  # 📊 phpMyAdmin (Optionnel en prod)
  # ============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pizzeria_phpmyadmin
    restart: unless-stopped
    # 🔒 Limite mémoire pour serveur 2Go
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    profiles:
      - tools  # ⚠️ Désactivé par défaut en prod, activer avec: docker compose --profile tools up
    environment:
      PMA_HOST: database
      PMA_USER: pizzeria_user
      PMA_PASSWORD: pizzeria_password
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - pizzeria_network

# ============================================
# 📁 Volumes persistants
# ============================================
volumes:
  database_data:
    driver: local
  vendor_data:
    driver: local
  var_data:
    driver: local

# ============================================
# 🔗 Réseaux
# ============================================
networks:
  pizzeria_network:
    driver: bridge
