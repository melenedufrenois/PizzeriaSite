name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
    permissions:
      contents: read

    steps:
      - name: Validate deployment script
        run: |
          set -euo pipefail
          test -x /home/mehdi/PizzeriaSite/deploy.sh

      - name: Run deployment on self-hosted runner
        run: |
          set -euo pipefail
          cd /home/mehdi/PizzeriaSite
          bash ./deploy.sh --branch prod
