name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pizzeria_test
          MYSQL_USER: pizzeria_user
          MYSQL_PASSWORD: pizzeria_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://pizzeria_user:pizzeria_password@127.0.0.1:3306/pizzeria_test?serverVersion=8.0&charset=utf8mb4"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Build Tailwind CSS
      run: php bin/console tailwind:build

    - name: Setup test database
      run: |
        php bin/console doctrine:schema:create --env=test
        php bin/console doctrine:fixtures:load --env=test --no-interaction

    - name: Start PHP Server
      run: APP_ENV=test php -S localhost:8000 -t public public/index.php &

    - name: Wait for server
      run: |
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /tmp/response.html -w '%{http_code}' http://localhost:8000/ 2>/dev/null || echo "000")
          echo "Attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then exit 0; fi
          sleep 2
        done
        echo "=== Server failed. Last response body: ==="
        cat /tmp/response.html 2>/dev/null | head -100 || true
        exit 1

    - name: Run Playwright tests
      run: npm test
      env:
        BASE_URL: http://localhost:8000

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
