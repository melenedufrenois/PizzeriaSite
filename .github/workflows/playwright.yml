name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pizzeria_test
          MYSQL_USER: pizzeria_user
          MYSQL_PASSWORD: pizzeria_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://pizzeria_user:pizzeria_password@127.0.0.1:3306/pizzeria?serverVersion=8.0&charset=utf8mb4"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install importmap vendor assets
      run: php bin/console importmap:install

    - name: Build Tailwind CSS
      run: php bin/console tailwind:build --env=test

    - name: Setup test database
      run: |
        php bin/console doctrine:schema:create --env=test
        php bin/console doctrine:fixtures:load --env=test --no-interaction

    - name: Compile assets
      run: php bin/console asset-map:compile --env=test

    - name: Warmup cache
      run: php bin/console cache:warmup --env=test

    - name: Pre-flight check
      run: |
        php bin/console debug:router --env=test | head -20
        php bin/console about --env=test | head -30
        echo "--- Checking public/assets ---"
        ls -la public/assets/ 2>/dev/null | head -10 || echo "public/assets/ is EMPTY"

    - name: Start PHP Server
      run: |
        mkdir -p var/log
        APP_ENV=test php -S localhost:8000 -t public public/index.php > var/log/php-server.log 2>&1 &

    - name: Wait for server
      run: |
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /tmp/response.html -w '%{http_code}' http://localhost:8000/ 2>/dev/null || echo "000")
          echo "Attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then exit 0; fi
          if [ "$STATUS" = "500" ] && [ "$i" = "3" ]; then
            echo "=== RESPONSE BODY (attempt 3) ==="
            cat /tmp/response.html 2>/dev/null | grep -oP '<title>.*?</title>' || true
            cat /tmp/response.html 2>/dev/null | grep -oP 'exception-message[^<]*<[^<]*<[^<]*' | head -5 || true
            cat /tmp/response.html 2>/dev/null | grep -i 'error\|exception\|fatal' | head -10 || true
            echo "=== SYMFONY LOG ==="
            cat var/log/test.log 2>/dev/null | tail -30 || echo "No test.log"
            echo "=== PHP SERVER LOG ==="
            cat var/log/php-server.log 2>/dev/null | tail -20 || echo "No php-server.log"
          fi
          sleep 2
        done
        echo "=== Server STILL failing. Full response: ==="
        cat /tmp/response.html 2>/dev/null | head -200 || true
        echo "=== FULL SYMFONY LOG ==="
        cat var/log/test.log 2>/dev/null || echo "No test.log"
        echo "=== FULL PHP SERVER LOG ==="
        cat var/log/php-server.log 2>/dev/null || echo "No php-server.log"
        exit 1

    - name: Run Playwright tests
      run: npm test
      env:
        BASE_URL: http://localhost:8000

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
