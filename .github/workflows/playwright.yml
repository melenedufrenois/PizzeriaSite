name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: changeme
          MYSQL_DATABASE: pizzeria_test
          MYSQL_USER: pizzeria_user
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://pizzeria_user:changeme@127.0.0.1:3306/pizzeria?serverVersion=8.0&charset=utf8mb4"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install importmap vendor assets
      run: php bin/console importmap:install

    - name: Build Tailwind CSS
      run: php bin/console tailwind:build --env=test

    - name: Setup test database
      run: |
        # Schema + fixtures in pizzeria_test (Doctrine _test suffix for CLI)
        php bin/console doctrine:schema:create --env=test
        php bin/console doctrine:fixtures:load --env=test --no-interaction
        # Create pizzeria DB + grant access + copy data (web server may not use suffix)
        mysql -h 127.0.0.1 -u root -pchangeme -e "CREATE DATABASE IF NOT EXISTS pizzeria CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        mysql -h 127.0.0.1 -u root -pchangeme -e "GRANT ALL PRIVILEGES ON pizzeria.* TO 'pizzeria_user'@'%'; FLUSH PRIVILEGES;"
        mysqldump -h 127.0.0.1 -u root -pchangeme pizzeria_test | mysql -h 127.0.0.1 -u root -pchangeme pizzeria

    - name: Compile assets
      run: php bin/console asset-map:compile --env=test

    - name: Warmup cache
      run: php bin/console cache:warmup --env=test

    - name: Start PHP Server
      run: |
        mkdir -p var/log
        APP_ENV=test php -S localhost:8000 -t public public/index.php > var/log/php-server.log 2>&1 &

    - name: Wait for server
      run: |
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ 2>/dev/null || echo "000")
          echo "Attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then exit 0; fi
          sleep 2
        done
        echo "Server failed to start"
        cat var/log/php-server.log 2>/dev/null | tail -20 || true
        exit 1

    - name: Run Playwright tests
      run: npm test
      env:
        BASE_URL: http://localhost:8000

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
